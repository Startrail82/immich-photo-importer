[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoimporter"
version = "0.4.4"
license = { text = "MIT" }
description = "Downloads photos from iCloud, sorts them by date and passes favorites on to Immich"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
photoimporter = "photoimporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photoimporter = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
