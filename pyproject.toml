[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoimporter"
version = "0.1.0"
description = "Haalt foto's van iCloud, sorteert ze op datum en geeft favorieten door aan Immich"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
photoimporter = "photoimporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
