# Authentik proxy outpost for the Docker host that runs the Photo Importer (manual deployment).
# Set AUTHENTIK_TOKEN as a secret in your stack manager.
# The image tag must match the version of your Authentik server and worker.
services:
  authentik-outpost:
    image: ghcr.io/goauthentik/proxy:2026.8.4
    container_name: authentik-outpost
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: https://auth.example.com
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
    ports:
      # Bind to the LAN address of this host only; your reverse proxy forwards to it.
      - "<docker-host-ip>:9000:9000"
    networks:
      - outpost

networks:
  outpost:
    external: true
    name: authentik-outpost
